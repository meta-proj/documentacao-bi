<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plano de Contas Novo — Mapeamento de Códigos</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap');

  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --bg: #ffffff;
    --fg: #0a0a0a;
    --accent: #000000;
    --accent-dim: #0000001a;
    --grid-color: rgba(0, 0, 0, 0.04);
    --grid-accent: rgba(0, 0, 0, 0.05);
    --card-bg: rgba(255, 255, 255, 1);
    --card-border: rgba(0, 0, 0, 0.1);
    --tag-bg: rgba(0, 0, 0, 0.05);
    --code-bg: rgba(0, 0, 0, 0.06);
    --font-display: 'Space Grotesk', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  html {
    overflow-y: auto;
    height: auto;
  }

  body {
    font-family: var(--font-display);
    background: var(--bg);
    color: var(--fg);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    padding: 2rem 1.5rem;
  }

  .grid-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-image:
      linear-gradient(var(--grid-color) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
    background-size: 60px 60px;
    animation: gridShift 20s linear infinite;
    display: none;
  }

  .grid-bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(var(--grid-accent) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-accent) 1px, transparent 1px);
    background-size: 300px 300px;
    z-index: 0;
  }

  @keyframes gridShift {
    0% {
      background-position: 0 0;
    }
    100% {
      background-position: 60px 60px;
    }
  }

  .grid-glow {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    opacity: 1;
    display: none;
  }

  .grid-glow::after {
    content: '';
    position: absolute;
    inset: -50%;
    background: radial-gradient(ellipse 800px 600px at 30% 30%, rgba(100, 150, 255, 0.15), transparent 70%),
                radial-gradient(ellipse 600px 700px at 70% 60%, rgba(150, 100, 255, 0.1), transparent 70%),
                radial-gradient(ellipse 700px 500px at 50% 80%, rgba(100, 200, 255, 0.12), transparent 70%);
    animation: 
      glowFloat1 15s ease-in-out infinite,
      glowFloat2 18s ease-in-out infinite -3s;
  }

  .grid-glow::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 400px 300px at 40% 40%, rgba(100, 150, 255, 0.08), transparent 60%);
    animation: glowPulse 8s ease-in-out infinite;
  }

  @keyframes glowFloat1 {
    0%, 100% {
      transform: translate(0, 0);
    }
    25% {
      transform: translate(100px, -80px);
    }
    50% {
      transform: translate(-80px, 100px);
    }
    75% {
      transform: translate(80px, -100px);
    }
  }

  @keyframes glowFloat2 {
    0%, 100% {
      transform: translate(0, 0);
    }
    25% {
      transform: translate(-120px, 80px);
    }
    50% {
      transform: translate(100px, -120px);
    }
    75% {
      transform: translate(-100px, 100px);
    }
  }

  @keyframes glowPulse {
    0%, 100% {
      opacity: 0.6;
    }
    50% {
      opacity: 0.3;
    }
  }

  .floating-icons-container {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
    display: none;
  }

  .floating-icon {
    position: absolute;
    opacity: 0.25;
    pointer-events: none;
    animation: float linear infinite;
    filter: drop-shadow(0 0 8px rgba(0, 0, 0, 0.1));
  }

  @keyframes float {
    0% {
      transform: translateY(100vh) rotate(0deg);
    }
    100% {
      transform: translateY(-10vh) rotate(360deg);
    }
  }

  .floating-icon.speed-1 { animation-duration: 45s; }
  .floating-icon.speed-2 { animation-duration: 55s; }
  .floating-icon.speed-3 { animation-duration: 65s; }
  .floating-icon.speed-4 { animation-duration: 75s; }
  .floating-icon.speed-5 { animation-duration: 85s; }

  .nav-dots {
    position: fixed;
    right: 2rem;
    top: 50%;
    transform: translateY(-50%);
    z-index: 100;
    display: none;
    flex-direction: column;
    gap: 12px;
  }

  .nav-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 1.5px solid rgba(0, 0, 0, 0.2);
    background: transparent;
    cursor: pointer;
    transition: all 0.6s ease;
    position: relative;
  }

  .nav-dot:hover {
    border-color: var(--accent);
  }

  .nav-dot.active {
    border-color: var(--accent);
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent-dim);
  }

  .nav-dot .dot-label {
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    white-space: nowrap;
    font-size: 0.7rem;
    font-family: var(--font-mono);
    color: var(--fg);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    background: var(--bg);
    padding: 2px 8px;
    border-radius: 4px;
    border: 1px solid var(--card-border);
  }

  .nav-dot:hover .dot-label {
    opacity: 1;
  }

  .section-counter {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    z-index: 100;
    font-family: var(--font-mono);
    font-size: 0.85rem;
    color: rgba(0, 0, 0, 0.3);
    letter-spacing: 0.05em;
    display: none;
  }

  .counter-sep {
    margin: 0 4px;
  }

  #currentNum {
    color: var(--accent);
    font-weight: 700;
  }

  .sections-wrapper {
    position: relative;
    inset: auto;
    z-index: 10;
  }

  .section {
    position: relative;
    inset: auto;
    display: block;
    align-items: auto;
    justify-content: auto;
    padding: 0;
    opacity: 1;
    transform: none;
    filter: none;
    pointer-events: auto;
    transition: none;
  }

  .section.active {
    opacity: 1;
    transform: none;
    filter: none;
    pointer-events: auto;
  }

  .section.exit-up {
    opacity: 1;
    transform: none;
    filter: none;
  }

  .section.exit-down {
    opacity: 1;
    transform: none;
    filter: none;
  }

  .section-inner {
    max-width: 1200px;
    width: 100%;
    margin: 0 auto;
  }

  .landing {
    text-align: center;
  }

  .landing-badge {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.2em;
    color: var(--accent);
    border: 1px solid var(--accent-dim);
    background: var(--tag-bg);
    padding: 6px 16px;
    border-radius: 100px;
    margin-bottom: 2rem;
  }

  .landing h1 {
    font-size: clamp(2.5rem, 6vw, 5rem);
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -0.03em;
    margin-bottom: 1.5rem;
  }

  .text-accent {
    color: var(--accent);
  }

  .landing-sub {
    font-size: 1.1rem;
    color: rgba(0, 0, 0, 0.5);
    max-width: 500px;
    margin: 0 auto 3rem;
    line-height: 1.6;
  }

  .scroll-hint {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    color: rgba(0, 0, 0, 0.3);
    font-family: var(--font-mono);
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .scroll-arrow {
    width: 20px;
    height: 20px;
    border-right: 2px solid var(--accent);
    border-bottom: 2px solid var(--accent);
    transform: rotate(45deg);
    animation: bounce-down 2s infinite;
  }

  @keyframes bounce-down {
    0%, 100% { transform: rotate(45deg) translateY(0); opacity: 0.5; }
    50% { transform: rotate(45deg) translateY(6px); opacity: 1; }
  }

  .section-tag {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 0.75rem;
  }

  .section-inner h2 {
    font-size: clamp(1.8rem, 4vw, 3rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 2.5rem;
    color: #c36
  }

  .info-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 1.25rem;
  }

  .info-card {
    background: var(--card-bg);
    backdrop-filter: blur(12px);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 1.5rem;
    transition: transform 0.6s ease, box-shadow 0.6s ease;
  }

  .info-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
  }

  .card-icon {
    font-size: 1.5rem;
    margin-bottom: 0.75rem;
  }

  .info-card h3 {
    font-size: 0.9rem;
    font-weight: 600;
    margin-bottom: 0.5rem;
    letter-spacing: -0.01em;
  }

  .info-card p {
    font-size: 0.85rem;
    color: rgba(0, 0, 0, 0.6);
    line-height: 1.6;
  }

  .info-card ul {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .info-card li {
    font-size: 0.82rem;
    color: rgba(0, 0, 0, 0.6);
    padding-left: 14px;
    position: relative;
    line-height: 1.5;
  }

  .info-card li::before {
    content: '›';
    position: absolute;
    left: 0;
    color: var(--accent);
    font-weight: 700;
  }

  code {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    background: var(--code-bg);
    padding: 2px 6px;
    border-radius: 4px;
  }

  @media (max-width: 768px) {
    body {
      padding: 1rem 1rem;
    }

    .search-bar input {
      font-size: 14px;
      padding: 10px 12px 10px 36px;
    }

    header h1 {
      font-size: 18px;
    }

    .group-title {
      font-size: 11px;
    }

    .badge {
      font-size: 9px;
      padding: 0px 6px;
    }
  }

  .map-container {
    position: relative;
    width: 100%;
    height: 60vh;
    background: var(--tag-bg);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    overflow: hidden;
    padding: 2rem;
  }

  .map-grid {
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 100%;
    z-index: 2;
    position: relative;
  }

  .map-node {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    padding: 1rem;
    border-radius: 8px;
    font-family: var(--font-mono);
    font-size: 0.75rem;
    text-align: center;
    width: 150px;
    transition: all 0.3s ease;
    cursor: pointer;
  }

  .map-node:hover {
    border-color: var(--accent);
    box-shadow: 0 0 15px var(--accent-dim);
    transform: scale(1.05);
  }

  .map-connections {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
  }

  .connection-line {
    stroke: var(--accent);
    stroke-width: 1.5;
    stroke-dasharray: 5;
    opacity: 0.3;
    fill: none;
  }

  .orchestration-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 1.5rem;
    margin-top: 2rem;
  }

  .orch-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 2rem;
    position: relative;
    overflow: hidden;
    transition: all 0.4s ease;
  }

  .orch-card:hover {
    border-color: var(--accent);
    box-shadow: 0 10px 30px var(--accent-dim);
  }

  .orch-status {
    position: absolute;
    top: 1rem;
    right: 1rem;
    font-family: var(--font-mono);
    font-size: 0.65rem;
    text-transform: uppercase;
    color: #28a745;
    background: rgba(40, 167, 69, 0.1);
    padding: 4px 10px;
    border-radius: 100px;
  }

  .orch-icon {
    font-size: 2rem;
    margin-bottom: 1.5rem;
  }

  .orch-card h3 {
    font-family: var(--font-display);
    margin-bottom: 0.5rem;
    font-size: 1.2rem;
  }

  .orch-card p {
    font-size: 0.9rem;
    color: rgba(0,0,0,0.5);
    margin-bottom: 1.5rem;
  }

  .orch-meta {
    display: flex;
    flex-direction: column;
    gap: 8px;
    border-top: 1px solid var(--card-border);
    padding-top: 1rem;
    font-family: var(--font-mono);
    font-size: 0.75rem;
  }

  header {
    margin-bottom: 32px;
    border-bottom: 1px solid var(--card-border);
    padding-bottom: 20px;
  }
  header h1 {
    font-size: 22px;
    font-weight: 700;
    color: var(--fg);
    letter-spacing: -0.5px;
  }
  header p { color: rgba(0, 0, 0, 0.5); margin-top: 4px; font-size: 12px; }

  /* search */
  .search-bar {
    margin-bottom: 24px;
    position: relative;
  }
  .search-bar input {
    width: 100%;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 6px;
    padding: 8px 12px 8px 36px;
    color: var(--fg);
    font-family: var(--font-mono);
    font-size: 12px;
    outline: none;
    transition: border-color .15s;
  }
  .search-bar input:focus { border-color: var(--accent); }
  .search-bar svg {
    position: absolute; left: 10px; top: 50%;
    transform: translateY(-50%); opacity: .4;
    pointer-events: none;
  }

  /* stats */
  .stats {
    display: flex; gap: 16px; margin-bottom: 28px; flex-wrap: wrap;
  }
  .stat {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 6px;
    padding: 10px 16px;
    min-width: 120px;
  }
  .stat-num { font-size: 22px; font-weight: 700; color: var(--accent); }
  .stat-label { font-size: 11px; color: rgba(0, 0, 0, 0.5); margin-top: 2px; }

  /* groups */
  .group {
    margin-bottom: 12px;
    border: 1px solid var(--card-border);
    border-radius: 8px;
    overflow: hidden;
  }

  .group-header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    cursor: pointer;
    user-select: none;
    background: var(--card-bg);
    transition: background .12s;
  }
  .group-header:hover { background: rgba(0, 0, 0, 0.03); }

  .color-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .group-title {
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 12.5px;
    flex: 1;
  }

  .group-meta { display: flex; align-items: center; gap: 8px; }
  .badge {
    background: rgba(0, 0, 0, 0.05);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 1px 8px;
    font-size: 10px;
    color: rgba(0, 0, 0, 0.5);
    font-family: var(--font-mono);
  }

  .chevron {
    width: 16px; height: 16px;
    color: rgba(0, 0, 0, 0.3);
    transition: transform .2s;
    flex-shrink: 0;
  }
  .group.open .chevron { transform: rotate(90deg); }

  /* subtotal row */
  .subtotal-group .group-header {
    background: rgba(0, 0, 0, 0.02);
    border-bottom: 1px solid var(--card-border);
  }
  .subtotal-group .group-title { color: var(--accent); }

  /* body */
  .group-body {
    display: none;
    padding: 0;
  }
  .group.open .group-body { display: block; }

  /* sub-group */
  .subgroup { border-top: 1px solid var(--card-border); }
  .subgroup-title {
    padding: 7px 14px 7px 36px;
    font-size: 11px;
    color: rgba(0, 0, 0, 0.5);
    background: rgba(0, 0, 0, 0.02);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .5px;
    border-bottom: 1px solid var(--card-border);
    display: flex; align-items: center; gap: 8px;
  }
  .subgroup-title span {
    font-family: var(--font-mono);
    background: rgba(0, 0, 0, 0.05);
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 10px;
    text-transform: none;
    letter-spacing: 0;
    color: var(--fg);
  }

  /* account rows */
  .account {
    display: flex;
    align-items: center;
    gap: 0;
    padding: 5px 14px 5px 36px;
    border-bottom: 1px solid rgba(0, 0, 0, 0.03);
    transition: background .1s;
  }
  .account:last-child { border-bottom: none; }
  .account:hover { background: rgba(0, 0, 0, 0.03); }

  .acc-code {
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--accent);
    min-width: 160px;
    flex-shrink: 0;
  }
  .acc-alias {
    font-family: var(--font-mono);
    font-size: 10px;
    color: rgba(0, 0, 0, 0.4);
    min-width: 120px;
    flex-shrink: 0;
    padding-right: 8px;
  }
  .acc-name {
    color: var(--fg);
    font-size: 12px;
    opacity: .85;
  }

  /* highlight on search */
  .highlight { background: rgba(0, 0, 0, 0.1); border-radius: 2px; }

  .hidden { display: none !important; }

  footer {
    margin-top: 40px;
    padding-top: 16px;
    border-top: 1px solid var(--card-border);
    font-size: 11px;
    color: rgba(0, 0, 0, 0.5);
  }

  #container {
    max-width: 1200px;
    margin: 0 auto;
  }
</style>
</head>
<body>

<header>
  <h1><center>Mapeamento de Códigos BI Contábil</center></h1>
</header>

<div class="stats">
  <div class="stat"><div class="stat-num" id="totalAccounts">0</div><div class="stat-label">Contas mapeadas</div></div>
  <div class="stat"><div class="stat-num" id="totalGroups">0</div><div class="stat-label">Grupos DRE</div></div>
  <div class="stat"><div class="stat-num" id="totalSubgroups">0</div><div class="stat-label">Sub-grupos</div></div>
</div>

<div class="search-bar">
  <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.099zm-5.242 1.656a5.5 5.5 0 1 1 0-11 5.5 5.5 0 0 1 0 11z"/></svg>
  <input type="text" id="searchInput" placeholder="Buscar por código ou nome de conta..." oninput="filterAccounts(this.value)" />
</div>

<div id="container"></div>

<footer>
  Fonte: Power BI Desktop &mdash; Tabela <code>Plano de Contas</code> cruzada com <code>Plano de Contas Novo</code>
</footer>

// Build UI
const container = document.getElementById('container');
let totalAccounts = 0, totalSubgroups = 0;
const groups = Object.entries(DATA).sort((a,b)=>a[1].order-b[1].order);

groups.forEach(([groupName, group]) => {
  const subgroupEntries = Object.entries(group.subgroups);
  const accCount = subgroupEntries.reduce((s,[,a])=>s+a.length,0);
  totalAccounts += accCount;
  totalSubgroups += subgroupEntries.length;

  const el = document.createElement('div');
  el.className = 'group' + (group.subtotal ? ' subtotal-group' : '');
  el.dataset.group = groupName.toLowerCase();

  const chevronSVG = `<svg class="chevron" viewBox="0 0 16 16" fill="currentColor"><path d="M6.22 3.22a.75.75 0 0 1 1.06 0l4.25 4.25a.75.75 0 0 1 0 1.06l-4.25 4.25a.75.75 0 0 1-1.06-1.06L9.94 8 6.22 4.28a.75.75 0 0 1 0-1.06z"/></svg>`;

  let bodyHTML = '';
  subgroupEntries.forEach(([sgName, accounts]) => {
    const [sgCode, sgDesc] = sgName.split(' — ');
    bodyHTML += `<div class="subgroup">
      <div class="subgroup-title"><span>${sgCode}</span>${sgDesc||''}</div>`;
    accounts.forEach(acc => {
      bodyHTML += `<div class="account" data-search="${(acc.code+' '+acc.alias+' '+acc.name).toLowerCase()}">
        <span class="acc-code">${acc.code}</span>
        <span class="acc-alias">${acc.alias || ''}</span>
        <span class="acc-name">${acc.name}</span>
      </div>`;
    });
    bodyHTML += '</div>';
  });

  if (group.subtotal && subgroupEntries.length === 0) {
    bodyHTML = '';
  }

  el.innerHTML = `
    <div class="group-header" onclick="toggleGroup(this)">
      <span class="color-dot" style="background:${group.color}"></span>
      <span class="group-title" style="color:${group.color}">${groupName}</span>
      <div class="group-meta">
        ${accCount > 0 ? `<span class="badge">${accCount} contas</span>` : ''}
        ${group.subtotal ? '<span class="badge" style="color:var(--subtotal)">calculado</span>' : ''}
      </div>
      ${bodyHTML ? chevronSVG : ''}
    </div>
    ${bodyHTML ? `<div class="group-body">${bodyHTML}</div>` : ''}
  `;
  container.appendChild(el);
});

document.getElementById('totalAccounts').textContent = totalAccounts;
document.getElementById('totalGroups').textContent = groups.length;
document.getElementById('totalSubgroups').textContent = totalSubgroups;

function toggleGroup(header) {
  const group = header.closest('.group');
  group.classList.toggle('open');
}

function filterAccounts(query) {
  const q = query.toLowerCase().trim();
  document.querySelectorAll('.group').forEach(group => {
    if (!q) {
      group.classList.remove('open', 'hidden');
      group.querySelectorAll('.account').forEach(a => a.classList.remove('hidden'));
      group.querySelectorAll('.subgroup').forEach(s => s.classList.remove('hidden'));
      return;
    }
    let groupHasMatch = false;
    group.querySelectorAll('.subgroup').forEach(sg => {
      let sgHasMatch = false;
      sg.querySelectorAll('.account').forEach(acc => {
        const match = acc.dataset.search.includes(q) || group.dataset.group.includes(q);
        acc.classList.toggle('hidden', !match);
        if (match) sgHasMatch = true;
      });
      sg.classList.toggle('hidden', !sgHasMatch);
      if (sgHasMatch) groupHasMatch = true;
    });
    if (group.dataset.group.includes(q)) groupHasMatch = true;
    group.classList.toggle('hidden', !groupHasMatch);
    group.classList.toggle('open', groupHasMatch && !!q);
  });
}
</script>
</body>
