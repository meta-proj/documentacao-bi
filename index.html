<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Documentação | M&TA</title>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap');

    * { 
        margin: 0; 
        padding: 0; 
        box-sizing: border-box; 
        font-family: 'Space Grotesk', sans-serif; 
    }

    :root {
      --bg-gradient-1: #f5f5f5;
      --bg-gradient-2: #e8e8e8;
      --accent: #000000;
      --accent-light: #333333;
      --card-bg: rgba(255, 255, 255, 0.98);
      --card-border: rgba(0, 0, 0, 0.1);
      --text-primary: #0a0a0a;
      --text-secondary: #666666;
      --btn-gradient-1: #2a2a2a;
      --btn-gradient-2: #1a1a1a;
    }

    body {
        background: linear-gradient(135deg, #f0f0f0 0%, #d9d9d9 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        position: relative;
        overflow-x: hidden;
    }

    #particles-js {
        position: fixed;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        z-index: 1; /* Partículas ao fundo */
    }

    .login-card {
        background: var(--card-bg);
        padding: 50px;
        border-radius: 24px;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15), 0 0 20px rgba(0, 0, 0, 0.08);
        width: 100%;
        max-width: 900px;
        max-height: 95vh;
        text-align: center;
        z-index: 10; /* Card acima das partículas */
        position: relative;
        display: flex;
        flex-direction: column;
        border: 1px solid var(--card-border);
        backdrop-filter: blur(10px);
    }

    h2 {
        color: var(--accent);
        margin-bottom: 12px;
        font-size: 1.75rem;
        font-weight: 700;
        flex-shrink: 0;
        letter-spacing: -0.02em;
    }

    .subtitle {
        color: var(--text-secondary);
        font-size: 0.95rem;
        margin-bottom: 30px;
        font-weight: 400;
    }

    .nav-menu {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
        overflow-y: auto;
        padding: 10px 8px; /* Adicionado padding para não cortar o efeito de hover */
        flex: 1;
    }

    .nav-menu::-webkit-scrollbar {
        width: 6px;
    }
    .nav-menu::-webkit-scrollbar-thumb {
        background: var(--accent);
        border-radius: 10px;
    }
    .nav-menu::-webkit-scrollbar-thumb:hover {
        background: var(--accent-light);
    }

    .nav-item {
        display: flex; /* Mudado para flex para alinhar o texto no centro */
        align-items: center;
        justify-content: center;
        padding: 20px 16px;
        text-decoration: none;
        color: white;
        background: linear-gradient(135deg, #2a2a2a 0%, #1f1f1f 100%);
        border-radius: 16px;
        font-weight: 600;
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        border: 1px solid rgba(255, 255, 255, 0.08);
        font-size: 0.9rem;
        position: relative;
        overflow: hidden;
        min-height: 80px;
        text-align: center;
        cursor: pointer;
        z-index: 20; /* Garante que o link receba o clique */
    }

    .nav-item::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.1);
        transition: left 0.3s ease;
        z-index: -1;
    }

    .nav-item:hover::before {
        left: 0;
    }

    .nav-item:hover {
        background: linear-gradient(135deg, #404040 0%, #2a2a2a 100%);
        transform: translateY(-4px);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
        border-color: rgba(255, 255, 255, 0.2);
    }

    .nav-item:active {
        transform: translateY(-1px);
    }

    @media (max-width: 768px) {
        .login-card {
            padding: 30px;
            border-radius: 16px;
        }
        .nav-menu {
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        }
    }
</style>
</head>
<body>

    <div id="particles-js"></div>

    <div class="login-card">
        <h2>📚 Documentações</h2>
        <p class="subtitle">Acesse a documentação completa dos projetos</p>

        <div class="nav-menu">
            <a href="./IntegraDP/Tecnica.html" class="nav-item">IntegraDP - Técnica</a>
            <a href="./IntegraDP/User.html" class="nav-item">IntegraDP - Usuário</a>
            <a href="./Clientes/DP/DP_Clientes.html" class="nav-item">Clientes DP</a>
            <a href="./Clientes/CTB/CTB_Clientes.html" class="nav-item">Clientes CTB</a>
            <a href="./Clientes/CTB/ContasDRE.html" class="nav-item">DRE Contábil</a>
            <a href="./Clientes/FIS/FIS_Clientes.html" class="nav-item">Clientes FIS</a>
            <a href="./Clientes/CTB/CTB_user/CTB_Clientes_user.html" class="nav-item">Clientes CTB - Usuário</a>
            <a href="./Clientes/DP/DP_user/DP_Clientes_user.html" class="nav-item">Clientes DP - Usuário</a>
            <a href="./Clientes/DP/FIS_User/FIS_Clientes_user.html" class="nav-item">Clientes FIS - Usuário</a>
            <a href="./Clientes/documentacao_bi_clientes.pdf" class="nav-item" target="_blank">PDF - BI Clientes</a>
            <a href="./meta+/" class="nav-item">Meta+ - Usuário</a>
        </div>
    </div>

    <script>
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 100, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#a0a0a0" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.4, "random": true },
                "size": { "value": 2, "random": true },
                "line_linked": { "enable": true, "distance": 180, "color": "#808080", "opacity": 0.2, "width": 1 },
                "move": { "enable": true, "speed": 1.5, "direction": "none", "random": false, "straight": false, "out_mode": "out", "bounce": false }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": { "onhover": { "enable": true, "mode": "repulse" }, "onclick": { "enable": true, "mode": "push" }, "resize": true },
                "modes": { "repulse": { "distance": 150, "duration": 0.3 }, "push": { "particles_nb": 3 } }
            },
            "retina_detect": true
        });
    </script>
</body>
</html>
