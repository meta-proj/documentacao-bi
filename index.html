<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Documentação | M&TA</title>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap');

    * { 
        margin: 0; 
        padding: 0; 
        box-sizing: border-box; 
        font-family: 'Space Grotesk', sans-serif; 
    }

    :root {
      --bg-gradient-1: #0f172a;
      --bg-gradient-2: #1e293b;
      --accent: #3b82f6;
      --accent-light: #60a5fa;
      --card-bg: rgba(255, 255, 255, 0.95);
      --card-border: rgba(59, 130, 246, 0.2);
      --text-primary: #1e293b;
      --text-secondary: #64748b;
    }

    body {
        background: linear-gradient(135deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        position: relative;
        overflow-x: hidden;
    }

    #particles-js {
        position: fixed;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        z-index: 1;
    }

    .login-card {
        background: var(--card-bg);
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3), 0 0 1px rgba(59, 130, 246, 0.5);
        width: 100%;
        max-width: 480px;
        max-height: 90vh;
        text-align: center;
        z-index: 2;
        position: relative;
        display: flex;
        flex-direction: column;
        border: 1px solid var(--card-border);
        backdrop-filter: blur(10px);
    }

    h2 {
        color: var(--accent);
        margin-bottom: 12px;
        font-size: 1.75rem;
        font-weight: 700;
        flex-shrink: 0;
        letter-spacing: -0.02em;
    }

    .subtitle {
        color: var(--text-secondary);
        font-size: 0.95rem;
        margin-bottom: 30px;
        font-weight: 400;
    }

    .nav-menu {
        display: flex;
        flex-direction: column;
        gap: 10px;
        overflow-y: auto;
        padding-right: 8px;
    }

    .nav-menu::-webkit-scrollbar {
        width: 6px;
    }
    .nav-menu::-webkit-scrollbar-thumb {
        background: var(--accent);
        border-radius: 10px;
    }
    .nav-menu::-webkit-scrollbar-thumb:hover {
        background: var(--accent-light);
    }

    .nav-item {
        display: block;
        padding: 14px 18px;
        text-decoration: none;
        color: white;
        background: linear-gradient(135deg, var(--accent) 0%, #2563eb 100%);
        border-radius: 12px;
        font-weight: 600;
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        border: 1px solid rgba(255, 255, 255, 0.1);
        font-size: 0.95rem;
        position: relative;
        overflow: hidden;
    }

    .nav-item::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.2);
        transition: left 0.3s ease;
        z-index: -1;
    }

    .nav-item:hover::before {
        left: 0;
    }

    .nav-item:hover {
        background: linear-gradient(135deg, var(--accent-light) 0%, #60a5fa 100%);
        transform: translateY(-3px);
        box-shadow: 0 8px 24px rgba(59, 130, 246, 0.4);
        border-color: rgba(255, 255, 255, 0.3);
    }

    .nav-item:active {
        transform: translateY(-1px);
    }

    @media (max-width: 600px) {
        .login-card {
            padding: 24px;
            border-radius: 16px;
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        .subtitle {
            margin-bottom: 24px;
            font-size: 0.9rem;
        }

        .nav-item {
            padding: 12px 16px;
            font-size: 0.9rem;
        }
    }
</style>
</head>
<body>

    <div id="particles-js"></div>

    <div class="login-card">
        
        <h2>📚 Documentações</h2>
        <p class="subtitle">Acesse a documentação completa dos projetos</p>

        <div class="nav-menu">
            <a href="./IntegraDP/Tecnica.html" class="nav-item">IntegraDP - Técnica</a>
            <a href="./IntegraDP/User.html" class="nav-item">IntegraDP - Usuário</a>
            <a href="./Clientes/DP/DP_Clientes.html" class="nav-item">Clientes DP</a>
            <a href="./Clientes/CTB/CTB_Clientes.html" class="nav-item">Clientes CTB</a>
            <a href="./Clientes/CTB/ContasDRE.html" class="nav-item">DRE Contábil</a>
            <a href="./Clientes/FIS/FIS_Clientes.html" class="nav-item">Clientes FIS</a>
            <a href="./Clientes/CTB/CTB_user/CTB_Clientes_user.html" class="nav-item">Clientes CTB - Usuário</a>
            <a href="./Clientes/DP/DP_user/DP_Clientes_user.html" class="nav-item">Clientes DP - Usuário</a>
            <a href="./Clientes/DP/FIS_User/FIS_Clientes_user.html" class="nav-item">Clientes FIS - Usuário</a>
            <a href="./Clientes/documentacao_bi_clientes.pdf" class="nav-item">PDF - BI Clientes</a>
            <a href="./meta+/" class="nav-item">Meta+ - Usuário</a>
        </div>
    </div>

    <script>
        /* Configuração do Particles.js com cores modernizadas */
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 100, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#60a5fa" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.6, "random": true },
                "size": { "value": 2.5, "random": true },
                "line_linked": { "enable": true, "distance": 180, "color": "#3b82f6", "opacity": 0.3, "width": 1.2 },
                "move": { "enable": true, "speed": 1.5, "direction": "none", "random": false, "straight": false, "out_mode": "out", "bounce": false }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": { "onhover": { "enable": true, "mode": "repulse" }, "onclick": { "enable": true, "mode": "push" }, "resize": true },
                "modes": { "repulse": { "distance": 200, "duration": 0.4 }, "push": { "particles_nb": 4 } }
            },
            "retina_detect": true
        });
    </script>
</body>
</html>
